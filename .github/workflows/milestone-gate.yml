# Tier 3 - milestone gate. The release workflow runs it on every final tag (vX.Y.Z) before publishing can be
# approved (workflow_call). Run it on its own as a dry run before tagging: on demand, or with an optional
# release-candidate tag (vX.Y.Z-rc.N).
name: Milestone gate

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  ci:
    name: Tier 1 checks
    uses: ./.github/workflows/ci.yml

  release-metadata:
    name: Version, changelog, validation report
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/check_release.py "${TAG}"
        env:
          TAG: ${{ github.ref_name }}

  benchmarks:
    name: Extraction quality and performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Extraction quality (no regression > 1 point per entity kind)
        run: python scripts/benchmark_extraction.py --report extraction.md
      - name: Performance budget (SQLite)
        run: python scripts/benchmark_performance.py --report performance-sqlite.md
      - name: Performance budget (PostgreSQL)
        run: >-
          python scripts/benchmark_performance.py --report performance-postgres.md
          --budget benchmarks/performance-budget-postgres.json
          --database-url postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      - name: Publish reports
        if: always()
        run: cat extraction.md performance-sqlite.md performance-postgres.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-reports
          path: '*.md'
          retention-days: 90

  backup-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps .
      - run: python scripts/backup_restore_drill.py

  browser-and-dast:
    name: Browser end-to-end + OWASP ZAP against the container
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: docker build -t insight:rc .
      # INSIGHT_MAX_TLP=RED: the browser tests ingest the synthetic TLP:RED report to check label raising.
      - name: Start the container exactly as Compose does
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "E2E_PASSWORD=${password}" >> "$GITHUB_ENV"
          docker run -d --name insight --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 8080:8080 \
            -e INSIGHT_MAX_TLP=RED \
            -e INSIGHT_PASSWORD="${password}" -e INSIGHT_SESSION_SECRET="$(openssl rand -hex 32)" insight:rc
      - name: Install browser test tooling
        run: |
          pip install --require-hashes -r requirements-e2e.lock && pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - run: python scripts/smoke.py http://127.0.0.1:8080 --password "${E2E_PASSWORD}"
      - name: Playwright (Chromium)
        run: pytest tests/e2e -m e2e -v --junitxml=junit-e2e.xml
        env:
          INSIGHT_E2E_URL: http://127.0.0.1:8080
          INSIGHT_E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
      - name: OWASP ZAP baseline scan, signed in (fails on FAIL-level alerts)
        run: |
          cookie="$(python scripts/smoke.py http://127.0.0.1:8080 --password "${E2E_PASSWORD}" --no-demo --print-cookie)"
          echo "::add-mask::${cookie#insight_session=}"
          mkdir -p zap && chmod 777 zap
          # Pinned by digest (code review L7): it runs on the host network. Tag: stable.
          docker run --rm --network host -v "${PWD}/zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://127.0.0.1:8080/ -I -r zap-report.html -J zap-report.json \
            -z "-config replacer.full_list(0).description=session -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).replacement=${cookie}"
      - if: failure()
        run: docker logs insight
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-and-dast
          path: |
            junit-e2e.xml
            zap/
            screenshots/
          retention-days: 90

  sso-gate:
    # TIP 3.4d (ADR 0046): sign-in through a real provider. Keycloak (test realm tests/e2e/sso/realm.json),
    # Insight and a TLS proxy share one Docker network; a throwaway CA signs both names. Insight verifies the
    # provider against that CA (INSIGHT_OIDC_CA_FILE) on its private address (INSIGHT_OIDC_PRIVATE_NETWORK),
    # on port 443, as in production. Chromium signs in as each role; ZAP actively scans as the analyst.
    name: Sign-in through Keycloak, browser role matrix, ZAP active scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: docker build -t insight:rc .
      - name: Throwaway test CA, certificate and secrets for this run
        run: |
          mkdir -p sso-pki && cd sso-pki
          # Python 3.13 verifies strictly: the CA needs key usage, the server certificate key identifiers.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 1 \
            -subj "/CN=Insight gate test CA" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -keyout site.key -out site.csr -subj "/CN=insight.test"
          printf '%s\n' 'subjectAltName=DNS:idp.insight.test,DNS:insight.insight.test' \
            'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' 'subjectKeyIdentifier=hash' 'authorityKeyIdentifier=keyid,issuer' \
            > site.ext
          openssl x509 -req -in site.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out site.pem -days 1 \
            -extfile site.ext
          rm ca.key site.csr
          secret="$(openssl rand -hex 24)"
          password="$(openssl rand -hex 12)"
          echo "::add-mask::${secret}"
          echo "::add-mask::${password}"
          echo "SSO_CLIENT_SECRET=${secret}" >> "$GITHUB_ENV"
          echo "SSO_PASSWORD=${password}" >> "$GITHUB_ENV"
          sed -e "s/@CLIENT_SECRET@/${secret}/" -e "s/@PASSWORD@/${password}/g" \
            ../tests/e2e/sso/realm.json > realm.json
      - name: Start Keycloak, Insight and the TLS proxy
        run: |
          docker network create --subnet 172.30.0.0/24 sso
          # Pinned by digest. Tag: 26.8.2.
          docker run -d --name keycloak --network sso \
            -v "${PWD}/sso-pki/realm.json:/opt/keycloak/data/import/insight.json:ro" \
            quay.io/keycloak/keycloak@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3 \
            start-dev --import-realm --hostname=https://idp.insight.test --proxy-headers=xforwarded
          docker run -d --name insight --network sso --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "${PWD}/sso-pki/ca.pem:/run/insight-sso/ca.pem:ro" \
            -e INSIGHT_PASSWORD="$(openssl rand -hex 16)" -e INSIGHT_SESSION_SECRET="$(openssl rand -hex 32)" \
            -e INSIGHT_SECURE_COOKIES=1 -e INSIGHT_ALLOWED_HOSTS=insight.insight.test,127.0.0.1,localhost \
            -e INSIGHT_TRUSTED_PROXIES=172.30.0.10 -e INSIGHT_PUBLIC_URL=https://insight.insight.test \
            -e INSIGHT_OIDC_ISSUER=https://idp.insight.test/realms/insight -e INSIGHT_OIDC_CLIENT_ID=insight \
            -e INSIGHT_OIDC_CLIENT_SECRET="${SSO_CLIENT_SECRET}" -e INSIGHT_OIDC_PRIVATE_NETWORK=on \
            -e INSIGHT_OIDC_CA_FILE=/run/insight-sso/ca.pem -e INSIGHT_OIDC_VIEWER_GROUPS=insight-viewers \
            -e INSIGHT_OIDC_ANALYST_GROUPS=insight-analysts -e INSIGHT_OIDC_ADMIN_GROUPS=insight-admins \
            insight:rc
          # Pinned by digest. Tag: 2-alpine (Caddy 2.11.9).
          docker run -d --name proxy --network sso --ip 172.30.0.10 \
            --network-alias idp.insight.test --network-alias insight.insight.test -p 443:443 \
            -v "${PWD}/tests/e2e/sso/Caddyfile:/etc/caddy/Caddyfile:ro" -v "${PWD}/sso-pki:/certs:ro" \
            caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
      - name: Wait for the provider and Insight
        run: |
          get() { curl -fsS --cacert sso-pki/ca.pem --resolve "$1:443:127.0.0.1" "https://$1$2" -o /dev/null; }
          for _ in $(seq 1 120); do
            if get idp.insight.test /realms/insight/.well-known/openid-configuration \
              && get insight.insight.test /health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: The sign-in page offers the provider
        run: >-
          curl -fsS --cacert sso-pki/ca.pem --resolve insight.insight.test:443:127.0.0.1
          https://insight.insight.test/login | grep -q 'Sign in with your organisation'
      - name: Install browser test tooling
        run: |
          pip install --require-hashes -r requirements-e2e.lock && pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Role matrix in the browser (Chromium)
        run: pytest tests/e2e/test_sso_roles.py -m e2e -v --junitxml=junit-sso.xml
        env:
          INSIGHT_E2E_SSO_URL: https://insight.insight.test
          INSIGHT_E2E_SSO_PASSWORD: ${{ env.SSO_PASSWORD }}
      - name: OWASP ZAP active scan, signed in as an analyst (fails on high-risk alerts)
        env:
          INSIGHT_E2E_SSO_URL: https://insight.insight.test
          INSIGHT_E2E_SSO_PASSWORD: ${{ env.SSO_PASSWORD }}
        run: |
          cookie="$(python tests/e2e/sso_flow.py analyst)"
          echo "::add-mask::${cookie#insight_session=}"
          session() {
            curl -s -o /dev/null -w '%{http_code}' --cacert sso-pki/ca.pem \
              --resolve insight.insight.test:443:127.0.0.1 -H "Cookie: ${cookie}" \
              https://insight.insight.test/api/session
          }
          test "$(session)" = 200
          mkdir -p zap && chmod 777 zap
          # Pinned by digest (code review L7); on the gate's network only. Tag: stable.
          docker run --rm --network sso -v "${PWD}/zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-full-scan.py -t https://insight.insight.test/ -I -m 2 -T 25 \
            -r zap-active.html -J zap-active.json \
            -z "-config replacer.full_list(0).description=session -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).replacement=${cookie}"
          jq -r '.site[].alerts[] | "\(.riskdesc): \(.name) (\(.count))"' zap/zap-active.json | sort -u \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Analyst session after the scan: HTTP $(session)" | tee -a "$GITHUB_STEP_SUMMARY"
          high="$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap/zap-active.json)"
          test "${high}" = 0
      - if: failure()
        run: |
          for name in keycloak insight proxy; do
            echo "== ${name}"
            docker logs "${name}" 2>&1 | tail -150
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sso-gate
          path: |
            junit-sso.xml
            zap/
          retention-days: 90

  supply-chain:
    name: Licences and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python scripts/check_licenses.py
      - name: CycloneDX SBOM of the runtime dependency set
        run: |
          # --strict: without it an unreachable vulnerability service still exits 0 and writes an empty SBOM.
          pip-audit --strict --require-hashes --disable-pip -r requirements.lock -s osv \
            -f cyclonedx-json -o sbom-python.cdx.json
          python -c "import json,sys; n=len(json.load(open('sbom-python.cdx.json')).get('components',[])); print(n,'components'); sys.exit(n==0)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-python.cdx.json
          retention-days: 90

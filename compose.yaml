services:
  insight:
    build: .
    image: insight:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      INSIGHT_PASSWORD: ${INSIGHT_PASSWORD:?Run the credential setup in README first}
      INSIGHT_SESSION_SECRET: ${INSIGHT_SESSION_SECRET:?Run the credential setup in README first}
      INSIGHT_DATA_DIR: /data
      INSIGHT_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - insight-data:/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 1g
volumes:
  insight-data:

# Developer entry point for authoring migrations, e.g.:
#   INSIGHT_DATABASE_URL=sqlite:///data/dev.db alembic revision --autogenerate --rev-id 0003 -m "describe change"
# The application itself never reads this file: it applies src/insight/migrations programmatically at start-up.
[alembic]
script_location = %(here)s/src/insight/migrations
prepend_sys_path = src
